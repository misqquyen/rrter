<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CCxEllowen</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Poppins',sans-serif;
}

body{
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    overflow:hidden;

    background:
    linear-gradient(rgba(0,0,0,0.65), rgba(0,0,0,0.8)),
    url('https://cdn.aceimg.com/c7a162542.png');

    background-size:cover;
    background-position:center;
    background-repeat:no-repeat;
}

/* blur glow */
body::before{
    content:'';
    position:absolute;
    width:350px;
    height:350px;
    background:#ff005544;
    border-radius:50%;
    top:-100px;
    right:-100px;
    filter:blur(70px);
}

body::after{
    content:'';
    position:absolute;
    width:300px;
    height:300px;
    background:#4b6fff44;
    border-radius:50%;
    bottom:-100px;
    left:-100px;
    filter:blur(70px);
}

.box{
    position:relative;
    width:340px;
    padding:35px 28px;
    border-radius:28px;

    background:rgba(255,255,255,0.08);
    backdrop-filter:blur(14px);

    border:1px solid rgba(255,255,255,0.08);

    text-align:center;

    box-shadow:
    0 0 35px rgba(0,0,0,0.45),
    inset 0 0 20px rgba(255,255,255,0.03);

    animation:fade .8s ease;
}

@keyframes fade{
    from{
        opacity:0;
        transform:translateY(20px);
    }
    to{
        opacity:1;
        transform:translateY(0);
    }
}

.title{
    color:white;
    font-size:28px;
    font-weight:700;
    margin-bottom:10px;
    letter-spacing:1px;
}

.desc{
    color:#d4d4d4;
    font-size:13px;
    margin-bottom:28px;
    line-height:1.6;
}

.btn{
    width:100%;
    padding:16px;
    margin:12px 0;

    border:none;
    border-radius:18px;

    color:white;
    font-size:16px;
    font-weight:600;

    cursor:pointer;
    transition:.3s;
}

.btn:hover{
    transform:translateY(-3px) scale(1.02);
}

.watch{
    background:linear-gradient(135deg,#ff005d,#ff4d88);
    box-shadow:0 0 25px rgba(255,0,93,0.5);
}

.server2{
    background:rgba(255,255,255,0.08);
    border:1px solid rgba(255,255,255,0.08);
}

.server3{
    background:rgba(255,255,255,0.08);
    border:1px solid rgba(255,255,255,0.08);
}

.server2:hover,
.server3:hover{
    background:rgba(255,255,255,0.13);
}
</style>
</head>

<body>

<div class="box">

    <div class="title">WATCH NOW</div>

    <div class="desc">
        private access • fast streaming • updated daily
    </div>

    <button class="btn watch" onclick="goLink()">
        ▶ WATCH NOW
    </button>

    <button class="btn server2" onclick="goLink()">
        ⚡ SERVER 2
    </button>

    <button class="btn server3" onclick="goLink()">
        🔥 SERVER 3
    </button>

</div>

<script>
function goLink() {
    window.location.href = "https://sitefleck.com/bi09kx1pih?key=044be462574a7c91ceb1a90423ee2fdf";
}
</script>

</body>
</html>
